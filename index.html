    <script>
      // Filter benign Vite HMR websocket connection notifications in cloud sandbox
      (function() {
        function isIgnored(arg) {
          if (!arg) return false;
          var str = '';
          try {
            str = typeof arg === 'string' ? arg : (arg.message || arg.stack || (arg.reason && (arg.reason.message || String(arg.reason))) || String(arg));
          } catch(e) {
            str = String(arg || '');
          }
          return str.indexOf('[vite]') !== -1 ||
                 str.indexOf('vite:') !== -1 ||
                 str.indexOf('failed to connect to websocket') !== -1 ||
                 str.indexOf("reading 'send'") !== -1 ||
                 str.indexOf('WebSocket') !== -1 ||
                 str.indexOf('ws://') !== -1 ||
                 str.indexOf('wss://') !== -1;
        }

        if (typeof window !== 'undefined') {
          window.addEventListener('error', function(event) {
            var msg = (event && (event.message || (event.error && (event.error.message || event.error.stack)))) || '';
            if (isIgnored(msg)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(event) {
            var reason = (event && (event.reason ? (event.reason.message || event.reason.stack || String(event.reason)) : '')) || '';
            if (isIgnored(reason)) {
              if (event.preventDefault) event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
              return true;
            }
          }, true);
        }

        if (typeof console !== 'undefined') {
          var origError = Function.prototype.bind.call(console.error, console);
          var origWarn = Function.prototype.bind.call(console.warn, console);
          var origLog = Function.prototype.bind.call(console.log, console);
          var origInfo = Function.prototype.bind.call(console.info, console);

          console.error = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isIgnored(arguments[i])) return;
            }
            return origError.apply(console, arguments);
          };

          console.warn = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isIgnored(arguments[i])) return;
            }
            return origWarn.apply(console, arguments);
          };

          console.log = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isIgnored(arguments[i])) return;
            }
            return origLog.apply(console, arguments);
          };

          console.info = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isIgnored(arguments[i])) return;
            }
            return origInfo.apply(console, arguments);
          };
        }
      })();
    </script>
